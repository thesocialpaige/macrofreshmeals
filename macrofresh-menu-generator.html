<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroFresh · Menu Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --green:#5cb135;--green-dk:#4a9228;--black:#111;--white:#fafaf8;--muted:#888;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ── PASSWORD ── */
#screen-password{align-items:center;justify-content:center;padding:40px 20px;}
.pw-logo{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:0.04em;text-align:center;margin-bottom:4px;}
.pw-logo span{color:var(--green);}
.pw-sub{font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:48px;}
.pw-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:36px;width:100%;max-width:380px;text-align:center;}
.pw-label{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:block;}
.pw-input{width:100%;padding:14px 16px;background:#111;border:1.5px solid #2a2a2a;border-radius:10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:16px;letter-spacing:0.12em;text-align:center;outline:none;transition:border-color .2s;margin-bottom:16px;}
.pw-input:focus{border-color:var(--green);}
.pw-input.error{border-color:#ef4444;}
.pw-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background .2s;}
.pw-btn:hover{background:var(--green-dk);}
.pw-error{font-size:12px;color:#ef4444;margin-top:10px;display:none;}

/* ── SETUP SCREEN ── */
#screen-setup{background:var(--black);}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid #222;flex-wrap:wrap;gap:10px;}
.app-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.04em;}
.app-logo span{color:var(--green);}
.hdr-actions{display:flex;gap:8px;align-items:center;}
.btn{padding:9px 18px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:none;transition:all .2s;}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-dk);}
.btn-ghost{background:transparent;border:1px solid #333;color:#aaa;}
.btn-ghost:hover{border-color:#666;color:#fff;}

.setup-body{padding:24px 28px;flex:1;overflow-y:auto;}

/* Sheet URL input */
.sheet-bar{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sheet-bar label{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.sheet-input{flex:1;padding:10px 14px;background:#111;border:1.5px solid #2a2a2a;border-radius:8px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;min-width:200px;}
.sheet-input:focus{border-color:var(--green);}
.sheet-input::placeholder{color:#555;}
.btn-load{background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.btn-load:hover{background:var(--green-dk);}
.sheet-status{font-size:11px;color:var(--muted);width:100%;}
.sheet-status.ok{color:var(--green);}
.sheet-status.err{color:#ef4444;}

/* Week selector */
.week-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.week-row label{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.week-input{padding:9px 14px;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:8px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.week-input:focus{border-color:var(--green);}

/* Meal selector grid */
.cat-section{margin-bottom:28px;}
.cat-title{font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #222;}
.meals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}
.meal-card{background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:10px;}
.meal-card:hover{border-color:#444;}
.meal-card.selected{border-color:var(--green);background:#0d1f0a;}
.meal-check{width:18px;height:18px;border-radius:4px;border:1.5px solid #333;background:#111;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.meal-card.selected .meal-check{background:var(--green);border-color:var(--green);}
.meal-check-inner{color:#fff;font-size:11px;font-weight:900;display:none;}
.meal-card.selected .meal-check-inner{display:block;}
.meal-info{flex:1;}
.meal-card-name{font-size:13px;font-weight:600;color:var(--white);line-height:1.3;margin-bottom:3px;}
.meal-card-meta{font-size:11px;color:var(--muted);}
.meal-card-icons{font-size:10px;color:var(--green);margin-top:2px;}

.selected-count{font-size:12px;color:var(--muted);margin-bottom:8px;}
.selected-count span{color:var(--green);font-weight:700;}

.empty-state{text-align:center;padding:48px;color:#444;}
.empty-state .big{font-size:32px;margin-bottom:8px;}
.empty-state p{font-size:13px;}

/* ── PREVIEW SCREEN ── */
#screen-preview{background:#333;}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--black);flex-wrap:wrap;gap:10px;}
.ph-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.04em;}
.ph-logo span{color:var(--green);}
.ph-actions{display:flex;gap:8px;}
.btn-dl{background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background .2s;}
.btn-dl:hover{background:var(--green-dk);}
.preview-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;}

/* ── MENU CANVAS ── */
#menu-canvas{
  width:816px; /* 8.5in at 96dpi */
  min-height:1056px; /* 11in at 96dpi */
  background:#fff;
  color:#111;
  font-family:'DM Sans',sans-serif;
  padding:40px 44px 48px;
  box-shadow:0 4px 40px rgba(0,0,0,0.4);
  position:relative;
}

.menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.menu-logo-text{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:0.04em;color:#111;line-height:1;}
.menu-logo-text span{color:#5cb135;}
.menu-week{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#888;text-align:right;line-height:1.6;}

.menu-divider{height:3px;background:#111;margin:10px 0 16px;}

/* Two column layout */
.menu-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.menu-col{}

.menu-cat-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:0.04em;
  color:#5cb135;
  border-bottom:2px solid #5cb135;
  padding-bottom:4px;
  margin-bottom:12px;
}

.menu-cat-price{
  font-size:13px;
  font-weight:700;
  color:#111;
  margin-bottom:10px;
  margin-top:-6px;
}

.menu-meal{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee;}
.menu-meal:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}

.menu-meal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px;}
.menu-meal-name{font-size:13px;font-weight:800;color:#111;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2;flex:1;}
.menu-meal-price{font-size:13px;font-weight:800;color:#111;white-space:nowrap;flex-shrink:0;}

.menu-meal-icons{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap;}
.menu-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;flex-shrink:0;}
.icon-gf{background:#dcfce7;color:#166534;border:1px solid #86efac;}
.icon-ep{background:#111;color:#fff;}
.icon-keto{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.icon-paleo{background:#f0fdf4;color:#14532d;border:1px solid #86efac;}
.badge-new{background:#5cb135;color:#fff;font-size:7px;font-weight:900;padding:2px 5px;border-radius:4px;letter-spacing:0.08em;text-transform:uppercase;}

.menu-meal-macros{font-size:9.5px;font-weight:600;color:#555;margin-bottom:4px;letter-spacing:0.02em;}
.menu-meal-desc{font-size:9.5px;color:#666;line-height:1.4;}
.menu-meal-lc{font-size:9px;color:#5cb135;font-weight:600;margin-top:3px;}

.menu-footer{
  margin-top:20px;
  padding-top:12px;
  border-top:2px solid #111;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  color:#888;
}
.menu-footer-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#111;letter-spacing:0.04em;}
.menu-footer-logo span{color:#5cb135;}

/* Full-width categories (Soup/Salad, Snacks) */
.menu-full-width{margin-top:16px;}
.menu-full-width .menu-meals-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
</style>
</head>
<body>

<!-- PASSWORD -->
<div id="screen-password" class="screen active">
  <div class="pw-logo">MACRO<span>FRESH</span></div>
  <div class="pw-sub">Menu Generator</div>
  <div class="pw-card">
    <label class="pw-label" for="pw-input">Enter Password</label>
    <input type="password" id="pw-input" class="pw-input" placeholder="••••••••" autocomplete="off">
    <button class="pw-btn" onclick="checkPw()">Unlock →</button>
    <div class="pw-error" id="pw-error">Incorrect password.</div>
  </div>
</div>

<!-- SETUP -->
<div id="screen-setup" class="screen">
  <div class="app-header">
    <div class="app-logo">MACRO<span>FRESH</span> <span style="font-size:14px;font-family:'DM Sans';font-weight:600;color:#555;letter-spacing:normal;">Menu Generator</span></div>
    <div class="hdr-actions">
      <span id="sel-count" class="selected-count">Select meals below</span>
      <button class="btn btn-ghost" onclick="clearAll()">Clear All</button>
      <button class="btn btn-green" onclick="generateMenu()">Generate Menu →</button>
    </div>
  </div>

  <div class="setup-body">

    <!-- Sheet URL -->
    <div class="sheet-bar">
      <label>Google Sheet CSV Link</label>
      <input type="text" id="sheet-url" class="sheet-input" placeholder="Paste your published Google Sheet CSV link here...">
      <button class="btn-load" onclick="loadSheet()">Load Meals</button>
      <div class="sheet-status" id="sheet-status">← Paste your Google Sheet link and click Load Meals to get started</div>
    </div>

    <!-- Week of -->
    <div class="week-row">
      <label>Week Of:</label>
      <input type="text" id="week-of" class="week-input" placeholder="e.g. March 18 – March 22, 2026" style="width:280px;">
      <label style="margin-left:16px;">Order Deadline:</label>
      <input type="text" id="order-deadline" class="week-input" placeholder="e.g. Saturday, March 22 at Noon" style="width:260px;">
    </div>

    <!-- Meal selector -->
    <div id="meal-selector">
      <div class="empty-state">
        <div class="big">🥗</div>
        <p>Load your Google Sheet to see your meals</p>
      </div>
    </div>

  </div>
</div>

<!-- PREVIEW -->
<div id="screen-preview" class="screen">
  <div class="preview-header">
    <div class="ph-logo">MACRO<span>FRESH</span> <span style="font-size:13px;font-family:'DM Sans';font-weight:600;color:#555;letter-spacing:normal;">Menu Preview</span></div>
    <div class="ph-actions">
      <button class="btn btn-ghost" onclick="showScreen('screen-setup')">← Back</button>
      <button class="btn-dl" onclick="downloadPNG()">⬇ Download PNG</button>
    </div>
  </div>
  <div class="preview-wrap">
    <div id="menu-canvas"></div>
  </div>
</div>

<script>
const PASSWORD = "macrofresh";
let allMeals = [];
let selectedMeals = new Set();

// ── PASSWORD ──
function checkPw(){
  const v=document.getElementById('pw-input').value;
  if(v===PASSWORD){ showScreen('screen-setup'); }
  else{
    const i=document.getElementById('pw-input'),e=document.getElementById('pw-error');
    i.classList.add('error');e.style.display='block';
    setTimeout(()=>i.classList.remove('error'),1000);
  }
}
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── LOAD GOOGLE SHEET ──
function loadSheet(){
  const url = document.getElementById('sheet-url').value.trim();
  const status = document.getElementById('sheet-status');

  if(!url){
    status.textContent = '⚠ Please paste your Google Sheet CSV link first';
    status.className = 'sheet-status err';
    return;
  }

  // Convert edit URL to CSV export URL if needed
  let csvUrl = url;
  if(url.includes('docs.google.com/spreadsheets') && !url.includes('/pub')){
    const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(match){
      csvUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&sheet=Meals`;
    }
  }

  status.textContent = 'Loading meals...';
  status.className = 'sheet-status';

  fetch(csvUrl)
    .then(r => {
      if(!r.ok) throw new Error('Could not fetch sheet');
      return r.text();
    })
    .then(csv => {
      allMeals = parseCSV(csv);
      if(!allMeals.length) throw new Error('No meals found');
      renderMealSelector();
      status.textContent = `✓ Loaded ${allMeals.length} meals successfully`;
      status.className = 'sheet-status ok';
    })
    .catch(err => {
      status.textContent = `✗ Error: ${err.message}. Make sure the sheet is published as CSV.`;
      status.className = 'sheet-status err';
    });
}

function parseCSV(text){
  const lines = text.split('\n').filter(l=>l.trim());
  if(lines.length < 2) return [];

  const parseRow = line => {
    const res=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
      else if(c===','&&!inQ){res.push(cur.trim());cur='';}
      else{cur+=c;}
    }
    res.push(cur.trim());
    return res;
  };

  const headers = parseRow(lines[0]).map(h=>h.toLowerCase().trim());
  const idx = name => headers.findIndex(h=>h.includes(name));

  const iName    = idx('meal name');
  const iCat     = idx('category');
  const iPrice   = idx('price');
  const iDesc    = idx('description');
  const iCal     = idx('calorie');
  const iPro     = idx('protein');
  const iCarb    = idx('carbs');
  const iFat     = idx('fat');
  const iEP      = idx('extra protein');
  const iLC      = idx('low carb option');
  const iLCPrice = idx('lc price');
  const iLCDesc  = idx('lc description');
  const iLCCal   = idx('lc calories');
  const iLCPro   = idx('lc protein');
  const iLCCarb  = idx('lc carbs');
  const iLCFat   = idx('lc fat');
  const iGF      = idx('gluten free');
  const iKeto    = idx('keto');
  const iPaleo   = idx('paleo');
  const iNew     = idx('is new');

  const meals = [];
  for(let i=1;i<lines.length;i++){
    const row = parseRow(lines[i]);
    const name = (row[iName]||'').replace(/^"|"$/g,'').trim();
    if(!name || name.startsWith('←')) continue;
    meals.push({
      name,
      cat:     (row[iCat]||'').trim(),
      price:   parseFloat(row[iPrice])||0,
      desc:    (row[iDesc]||'').replace(/^"|"$/g,'').trim(),
      cal:     row[iCal]||'',
      pro:     row[iPro]||'',
      carb:    row[iCarb]||'',
      fat:     row[iFat]||'',
      ep:      (row[iEP]||'').toUpperCase()==='YES',
      lc:      (row[iLC]||'').toUpperCase()==='YES',
      lcPrice: parseFloat(row[iLCPrice])||0,
      lcDesc:  (row[iLCDesc]||'').replace(/^"|"$/g,'').trim(),
      lcCal:   row[iLCCal]||'',
      lcPro:   row[iLCPro]||'',
      lcCarb:  row[iLCCarb]||'',
      lcFat:   row[iLCFat]||'',
      gf:      (row[iGF]||'').toUpperCase()==='YES',
      keto:    (row[iKeto]||'').toUpperCase()==='YES',
      paleo:   (row[iPaleo]||'').toUpperCase()==='YES',
      isNew:   (row[iNew]||'').toUpperCase()==='YES',
    });
  }
  return meals;
}

// ── DEMO DATA (if no sheet loaded) ──
function loadDemoData(){
  allMeals = [
    {name:"Breakfast Scramble",cat:"Morning Meals",price:10,desc:"Chicken sausage, farm fresh eggs and cheese scramble.",cal:457,pro:33,carb:22,fat:25,ep:false,lc:true,lcPrice:10,lcDesc:"No Potato",lcCal:350,lcPro:30,lcCarb:8,lcFat:20,gf:false,keto:false,paleo:false,isNew:true},

    {name:"Macro Market Fresh Salad",cat:"Morning Meals",price:12,desc:"Fresh greens with chicken, blueberries, strawberries, feta, candied nuts.",cal:504,pro:39,carb:62,fat:12,ep:false,lc:false,lcPrice:0,lcDesc:"",gf:true,keto:false,paleo:true,isNew:false},
    {name:"Monterey Chicken w/ Green Beans",cat:"Macro Meals",price:10.5,desc:"Seasoned chicken breast topped with BBQ sauce, cheese, bacon bits, and crispy fried onions.",cal:385,pro:44,carb:14,fat:14,ep:true,lc:false,lcPrice:0,lcDesc:"",gf:false,keto:false,paleo:false,isNew:false},
    {name:"Bourbon Chicken Loaded Mac",cat:"Macro Meals",price:10.5,desc:"Grilled chicken in bourbon glaze on top of mac & cheese. Topped with shredded cheese and green onions.",cal:446,pro:30,carb:47,fat:14,ep:true,lc:true,lcPrice:11.5,lcDesc:"Cheesy Cauliflower Florets",lcCal:299,lcPro:26,lcCarb:16,lcFat:13,gf:true,keto:false,paleo:false,isNew:true},
    {name:"Viral! Protein Loaded Sweet Potato Boat",cat:"Macro Meals",price:10.5,desc:"Baked sweet potato stuffed with taco seasoned ground beef, gooey cheese, drizzled with hot honey.",cal:455,pro:32,carb:40,fat:17,ep:true,lc:true,lcPrice:11.5,lcDesc:"Baked Butternut Squash",lcCal:317,lcPro:30,lcCarb:9,lcFat:17,gf:false,keto:false,paleo:false,isNew:false},
    {name:"Buffalo Chicken Soup",cat:"Soup/Salad",price:10.5,desc:"Rich and creamy buffalo chicken soup packed with protein and bold flavor.",cal:320,pro:28,carb:12,fat:18,ep:true,lc:false,lcPrice:0,lcDesc:"",gf:false,keto:false,paleo:false,isNew:false},
    {name:"Protein Puppy Chow",cat:"Snacks",price:5,desc:"Protein packed puppy chow! Have your sweet treat and hit your protein goals.",cal:213,pro:21,carb:17,fat:12,ep:false,lc:false,lcPrice:0,lcDesc:"",gf:false,keto:false,paleo:false,isNew:false},
    {name:"Caramel Apple Parfait",cat:"Snacks",price:6,desc:"A delicious caramel apple parfait packed with layers of flavor.",cal:289,pro:15,carb:42,fat:5,ep:false,lc:false,lcPrice:0,lcDesc:"",gf:false,keto:false,paleo:false,isNew:false},
  ];
  renderMealSelector();
  document.getElementById('sheet-status').textContent = '✓ Demo data loaded — connect your Google Sheet when ready';
  document.getElementById('sheet-status').className = 'sheet-status ok';
}

// ── RENDER MEAL SELECTOR ──
const CATS = ['Morning Meals','Macro Meals','Soup/Salad','Snacks'];

function renderMealSelector(){
  const sel = document.getElementById('meal-selector');
  sel.innerHTML = '';

  CATS.forEach(cat => {
    const meals = allMeals.filter(m=>m.cat===cat);
    if(!meals.length) return;

    const sec = document.createElement('div');
    sec.className = 'cat-section';
    sec.innerHTML = `<div class="cat-title">${cat} (${meals.length} meals)</div><div class="meals-grid" id="grid-${cat.replace(/\//g,'-').replace(/\s/g,'-')}"></div>`;
    sel.appendChild(sec);

    const grid = sec.querySelector('.meals-grid');
    meals.forEach(meal => {
      const card = document.createElement('div');
      card.className = 'meal-card' + (selectedMeals.has(meal.name) ? ' selected' : '');
      const icons = [
        meal.isNew ? '<span class="badge-new">NEW</span>' : '',
        meal.gf    ? '<span class="menu-icon icon-gf" title="Gluten Free">GF</span>' : '',
        meal.ep    ? '<span class="menu-icon icon-ep" title="Extra Protein">EP</span>' : '',
        meal.keto  ? '<span class="menu-icon icon-keto" title="Keto">K</span>' : '',
        meal.paleo ? '<span class="menu-icon icon-paleo" title="Paleo">P</span>' : '',
      ].filter(Boolean).join('');
      card.innerHTML = `
        <div class="meal-check"><span class="meal-check-inner">✓</span></div>
        <div class="meal-info">
          <div class="meal-card-name">${meal.name}</div>
          <div class="meal-card-meta">$${meal.price.toFixed(2)} · ${meal.cal||'?'} cal · P${meal.pro||'?'} C${meal.carb||'?'} F${meal.fat||'?'}</div>
          ${icons ? `<div class="meal-card-icons">${icons}</div>` : ''}
        </div>`;
      card.addEventListener('click', () => toggleMeal(meal.name, card));
      grid.appendChild(card);
    });
  });

  updateCount();
}

function toggleMeal(name, card){
  if(selectedMeals.has(name)){
    selectedMeals.delete(name);
    card.classList.remove('selected');
  } else {
    selectedMeals.add(name);
    card.classList.add('selected');
  }
  updateCount();
}

function clearAll(){
  selectedMeals.clear();
  document.querySelectorAll('.meal-card').forEach(c=>c.classList.remove('selected'));
  updateCount();
}

function updateCount(){
  const el = document.getElementById('sel-count');
  const n = selectedMeals.size;
  el.innerHTML = `<span>${n}</span> meal${n!==1?'s':''} selected`;
}

// ── GENERATE MENU ──
function generateMenu(){
  if(!selectedMeals.size){ alert('Please select at least one meal!'); return; }

  const weekOf   = document.getElementById('week-of').value || 'This Week';
  const deadline = document.getElementById('order-deadline').value || '';

  const chosen = allMeals.filter(m=>selectedMeals.has(m.name));

  // Group by category
  const byCat = {};
  CATS.forEach(c=>byCat[c]=[]);
  chosen.forEach(m=>{ if(byCat[m.cat]) byCat[m.cat].push(m); });

  // Get unique prices per category for display
  const catPrice = cat => {
    const meals = byCat[cat];
    if(!meals.length) return '';
    const prices = [...new Set(meals.map(m=>`$${m.price.toFixed(2)}`))];
    return prices.join(' / ');
  };

  function mealHTML(meal){
    const icons = [
      meal.isNew ? '<span class="badge-new">NEW</span>' : '',
      meal.gf    ? '<span class="menu-icon icon-gf">GF</span>' : '',
      meal.ep    ? '<span class="menu-icon icon-ep">EP</span>' : '',
      meal.keto  ? '<span class="menu-icon icon-keto">K</span>' : '',
      meal.paleo ? '<span class="menu-icon icon-paleo">P</span>' : '',
    ].filter(Boolean).join('');

    const macros = [meal.cal&&`Cal-${meal.cal}`, meal.fat&&`F-${meal.fat}`, meal.pro&&`P-${meal.pro}`].filter(Boolean).join('  ');
    const lcLine = meal.lc && meal.lcDesc
      ? `<div class="menu-meal-lc">Low Carb/GF: ${meal.lcDesc}${meal.lcCal ? ` · Cal-${meal.lcCal} F-${meal.lcFat} P-${meal.lcPro}` : ''} +$${(meal.lcPrice - meal.price).toFixed(2)}</div>`
      : '';

    return `<div class="menu-meal">
      <div class="menu-meal-top">
        <div class="menu-meal-name">${meal.name}</div>
        ${meal.price !== (byCat[meal.cat][0]?.price) || byCat[meal.cat].some(m=>m.price!==meal.price) ? `<div class="menu-meal-price">$${meal.price.toFixed(2)}</div>` : ''}
      </div>
      ${icons ? `<div class="menu-meal-icons">${icons}</div>` : ''}
      ${macros ? `<div class="menu-meal-macros">${macros}</div>` : ''}
      <div class="menu-meal-desc">${meal.desc}</div>
      ${lcLine}
    </div>`;
  }

  // Build two-column layout: Morning Meals + Macro Meals
  const mainLeft  = byCat['Morning Meals'];
  const mainRight = byCat['Macro Meals'];
  const soup      = byCat['Soup/Salad'];
  const snacks    = byCat['Snacks'];

  let html = `
    <div class="menu-top">
      <div class="menu-logo-text">MACRO<span>FRESH</span></div>
      <div class="menu-week">
        <strong>${weekOf}</strong><br>
        ${deadline ? `Order Deadline: ${deadline}` : ''}
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-cols">`;

  // Left column
  html += `<div class="menu-col">`;
  if(mainLeft.length){
    html += `<div class="menu-cat-title">Morning Meals</div>`;
    if(catPrice('Morning Meals')) html += `<div class="menu-cat-price">${catPrice('Morning Meals')}</div>`;
    html += mainLeft.map(mealHTML).join('');
  }
  if(soup.length){
    html += `<div class="menu-cat-title" style="margin-top:16px;">Soup / Salad</div>`;
    if(catPrice('Soup/Salad')) html += `<div class="menu-cat-price">${catPrice('Soup/Salad')}</div>`;
    html += soup.map(mealHTML).join('');
  }
  html += `</div>`;

  // Right column
  html += `<div class="menu-col">`;
  if(mainRight.length){
    html += `<div class="menu-cat-title">Macro Meals</div>`;
    if(catPrice('Macro Meals')) html += `<div class="menu-cat-price">${catPrice('Macro Meals')}</div>`;
    html += mainRight.map(mealHTML).join('');
  }
  if(snacks.length){
    html += `<div class="menu-cat-title" style="margin-top:16px;">Snacks</div>`;
    if(catPrice('Snacks')) html += `<div class="menu-cat-price">${catPrice('Snacks')}</div>`;
    html += snacks.map(mealHTML).join('');
  }
  html += `</div>`;

  html += `</div>`; // end menu-cols

  // Footer
  html += `<div class="menu-footer">
    <div class="menu-footer-logo">MACRO<span>FRESH</span></div>
    <div>
      <strong>Icon Key:</strong>
      GF = Gluten Free &nbsp;·&nbsp; EP = Extra Protein Available &nbsp;·&nbsp; K = Keto &nbsp;·&nbsp; P = Paleo
    </div>
    <div>macrofreshmeals.com</div>
  </div>`;

  document.getElementById('menu-canvas').innerHTML = html;
  showScreen('screen-preview');
}

// ── DOWNLOAD PNG ──
function downloadPNG(){
  const canvas = document.getElementById('menu-canvas');
  const btn = document.querySelector('.btn-dl');
  btn.textContent = 'Generating...';
  btn.disabled = true;

  html2canvas(canvas, {
    scale: 3, // high resolution
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false,
    width: canvas.offsetWidth,
    height: canvas.offsetHeight,
  }).then(c => {
    const link = document.createElement('a');
    link.download = 'macrofresh-menu.png';
    link.href = c.toDataURL('image/png');
    link.click();
    btn.textContent = '⬇ Download PNG';
    btn.disabled = false;
  }).catch(err => {
    alert('Download failed. Try right-clicking the menu and saving as image.');
    btn.textContent = '⬇ Download PNG';
    btn.disabled = false;
  });
}

// Load demo data on start
window.addEventListener('load', () => {
  loadDemoData();
});
</script>
